name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, unit tests, unused code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run knip

  e2e:
    name: Templates and end-to-end (pi + viewer + MCP + export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render every skill template (light + dark)
        run: npm run check:templates -- "$RUNNER_TEMP/screenshots"
      - name: Real pi session drives an artifact through MCP, memory and export
        run: npm run test:e2e
        env:
          E2E_SCREENSHOT: ${{ runner.temp }}/screenshots/e2e.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
