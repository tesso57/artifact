name: Windows scanner diagnostic
on: [push]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node diagnostic/scanner.mjs
      - run: node diagnostic/vite-scanner.mjs
