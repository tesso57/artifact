name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, unit tests, unused code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run knip
      - run: npm run check:package

  windows:
    name: Unit tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package

  minimum-node:
    name: Unit and end-to-end tests on minimum supported Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  node23-daemon:
    name: End-to-end with Node 23.0 daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 23.0.0
      - run: echo "PI_ARTIFACTS_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  e2e:
    name: Templates and end-to-end (pi sessions + daemon + MCP + export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render every bundled template (light + dark)
        run: npm run check:templates -- "$RUNNER_TEMP/screenshots"
      - name: Real pi sessions drive artifacts through the viewer daemon
        run: npm run test:e2e
        env:
          E2E_SCREENSHOT: ${{ runner.temp }}/screenshots/e2e.png
      - name: Test artifact directory with URL delimiters
        run: npm run test:e2e
        env:
          PI_ARTIFACTS_DIR: "${{ runner.temp }}/pi artifacts #?%"
          PI_ARTIFACTS_TEMPLATES: "${{ runner.temp }}/pi-safe-templates"
      - name: Daemon log
        if: failure()
        run: cat /tmp/pi-artifacts-*/.state/viewer.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  install:
    name: Install from npm pack and run e2e (artifacts ${{ matrix.path }}, temp ${{ matrix.temp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: normal
            temp: normal
          - path: "special #?%"
            temp: normal
          - path: normal
            temp: "special #?%"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p "$TMPDIR"
          npm run test:pack
        env:
          PI_ARTIFACTS_DIR: "${{ runner.temp }}/pi-artifacts-${{ matrix.path }}"
          TMPDIR: "${{ runner.temp }}/pi-install-${{ matrix.temp }}"
          E2E_NAVIGATION_STRESS: "${{ matrix.temp == 'special #?%' && '1' || '0' }}"
      - name: Daemon log
        if: failure()
        run: find "${{ runner.temp }}/pi-artifacts-${{ matrix.path }}" -name viewer.log -exec cat {} + || true
